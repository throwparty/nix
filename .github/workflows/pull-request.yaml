name: Pull request

on:
  pull_request:

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Detect changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            nix:
              - '*.nix'
              - 'overlays/**'
              - 'packages/**'
              - 'shells/**'
            workflows:
              - '.github/workflows/**'

  lint-workflows:
    name: Lint workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    permissions:
      contents: read
    uses: $/.github/workflows/workflows.lint.yaml

  lint-nix:
    name: Lint Nix
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    permissions:
      contents: read
    uses: $/.github/workflows/nix.lint.yaml

  ready:
    name: Ready
    needs: [lint-nix, lint-workflows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check dependencies
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
